<!DOCTYPE html>
<html>
<head>
    <title>Health Form - AI Health Advisor</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
        {% for category, message in messages %}
            <div class="flash {{ category }}">{{ message }}</div>
        {% endfor %}
    {% endif %}
{% endwith %}

        <h2>Hello {{ name }}, Fill Your Health Details</h2>
        <form method="post" action="/form">
            <label>Age:</label>
            <input type="number" name="age" required><br>
            <label>Gender:</label>
<select name="gender" required>
    <option value="">Select Gender</option>
    <option value="1">Male</option>
    <option value="0">Female</option>
</select>
            <label>Height (cm):</label>
            <input type="number" name="height" required><br>
            <label>Weight (kg):</label>
            <input type="number" name="weight" required><br>
            <label>Systolic BP:</label>
            <input type="number" name="ap_hi" required><br>
            <label>Diastolic BP:</label>
            <input type="number" name="ap_lo" required><br>
            <label>Cholesterol Level:</label>
<select name="cholesterol" required>
    <option value="">Select Level</option>
    <option value="1">Normal</option>
    <option value="2">Above Normal</option>
    <option value="3">High</option>
</select>

<label>Glucose Level:</label>
<select name="gluc" required>
    <option value="">Select Level</option>
    <option value="1">Normal</option>
    <option value="2">Above Normal</option>
    <option value="3">High</option>
</select>

<label>Do you smoke?</label>
<select name="smoke" required>
    <option value="">Select Option</option>
    <option value="1">Yes</option>
    <option value="0">No</option>
</select>

<label>Do you consume alcohol?</label>
<select name="alco" required>
    <option value="">Select Option</option>
    <option value="1">Yes</option>
    <option value="0">No</option>
</select>
            <label>Physical Activity (1=Active,0=Inactive):</label>
            <input type="number" name="active" min="0" max="1" required><br>
            <button type="submit">Check Risk</button>
        </form>
        
    <a href="/dashboard" class="btn">Dashboard</a>
    <a href="/history" class="btn">History Table</a>
    <a href="/logout" class="btn" style="float:right;">Logout</a>
</nav>
<!-- Keep the form code as before -->

    </div>
</body>
</html>
