<!DOCTYPE html>
<html>
<head>
    <title>Edit Profile</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container">
    <h2>Update Profile</h2>
    <form method="post" action="/update_profile">
        <label>First Name:</label>
        <input type="text" name="first_name" value="{{ user.first_name }}" required>
        <label>Middle Name:</label>
        <input type="text" name="middle_name" value="{{ user.middle_name }}">
        <label>Surname:</label>
        <input type="text" name="surname" value="{{ user.surname }}" required>
        <label>Phone Number:</label>
        <input type="tel" name="phone" value="{{ user.phone }}" required>
        <label>Date of Birth:</label>
        <input type="date" name="dob" value="{{ user.dob }}" required>
        <label>Gender:</label>
        <select name="gender" required>
            <option value="Male" {% if user.gender == "Male" %}selected{% endif %}>Male</option>
            <option value="Female" {% if user.gender == "Female" %}selected{% endif %}>Female</option>
            <option value="Other" {% if user.gender == "Other" %}selected{% endif %}>Other</option>
        </select>
        <label>Height (cm):</label>
        <input type="number" name="height" value="{{ user.height }}" required>
        <label>Weight (kg):</label>
        <input type="number" name="weight" value="{{ user.weight }}" required>
        <label>Location:</label>
        <input type="text" name="location" value="{{ user.location }}" required>
        <button type="submit">Update</button>
        <a href="/dashboard" class="btn">Cancel</a>
    </form>
</div>
</body>
</html>
