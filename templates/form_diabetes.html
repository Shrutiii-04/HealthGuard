<!DOCTYPE html>
<html>
<head>
    <title>Diabetes Risk Prediction</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container">
    <h2>Diabetes Risk Prediction</h2>
    <form method="POST" action="/predict_diabetes">
        <label>Glucose Level (mg/dL)</label>
        <input type="number" name="glucose" required>
        <label>Body Mass Index (BMI)</label>
        <input type="number" step="0.1" name="bmi" required>
        <label>Number of Pregnancies (if applicable)</label>
        <input type="number" name="pregnancies" required>
        <label>Diabetes Pedigree Factor</label>
        <input type="number" step="0.001" name="dpf" required>
        <button type="submit">Predict Diabetes Risk</button>
        <a href="/dashboard" class="btn">Back to Dashboard</a>
    </form>
</div>
</body>
</html>
